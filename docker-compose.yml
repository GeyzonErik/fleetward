services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fleetward-sqlserver
    environment:
      MSSQL_SA_PASSWORD: '${DB_PASSWORD}'
      ACCEPT_EULA: 'Y'
      APP_DB_NAME: '${DB_DATABASE}'
    ports:
      - '${DB_PORT}:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    entrypoint:
      - bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        SQL_PID=$$!
        until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; do
          sleep 2
        done
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$$APP_DB_NAME') CREATE DATABASE [$$APP_DB_NAME]"
        wait $$SQL_PID
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fleetward-redis
    ports:
      - '${REDIS_PORT}:6379'

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fleetward-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD}'
    ports:
      - '${RABBITMQ_PORT}:5672'
      - '15672:15672'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetward-app
    env_file:
      - .env.docker
    ports:
      - '3000:3000'
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  sqlserver-data:
