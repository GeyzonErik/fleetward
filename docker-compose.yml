services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fleetward-sqlserver
    environment:
      SA_PASSWORD: '${DB_PASSWORD}'
      ACCEPT_EULA: 'Y'
    ports:
      - '${DB_PORT}:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fleetward-redis
    ports:
      - '${REDIS_PORT}:6379'

volumes:
  sqlserver-data:
